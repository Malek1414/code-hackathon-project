name: FollowCam
options:
  bundleIdPrefix: com.followcam
targets:
  FollowCam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [FollowCamApp]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Films the game and tracks the ball.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Saves recordings.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Steers the FollowCam rig.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Reads your heart rate strap's live broadcast.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
