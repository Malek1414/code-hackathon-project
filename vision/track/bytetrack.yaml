# ByteTrack settings for 1080p50 basketball footage.
# Lower than ultralytics' defaults so a 0.2-confidence COCO "sports ball"
# still starts a track; buffer = 1 s at 50 fps so a screened player keeps his id.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.2
track_buffer: 50
match_thresh: 0.8
fuse_score: True
